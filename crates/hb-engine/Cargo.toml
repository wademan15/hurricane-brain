[package]
name = "hb-engine"
description = "Hurricane Brain EEG signal engine: conditioning, gating, confirmed peaks, tracking, ratio alignment with chance levels."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hb-run"
path = "src/bin/hb-run.rs"
required-features = ["cli"]

# Exports `hb_selfcheck(seed, secs)` from a wasm module so the native and browser builds can be
# compared (spec 11). Build: cargo build -p hb-engine --example wasm_probe --target wasm32-unknown-unknown --release
[[example]]
name = "wasm_probe"
crate-type = ["cdylib"]

[features]
default = ["cli"]
# The fixture runner. Pure std; the library itself does no I/O.
cli = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All transcendental functions go through libm so native and wasm32 agree bit for bit.
libm = "0.2"

[dev-dependencies]
serde_json = "1"
